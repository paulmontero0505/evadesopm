<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OPM Performance Appraisal System</title>
<style>
:root{--navy:#003b7a;--ink:#10233f;--blue:#1273c4;--orange:#f47c00;--paper:#f7f9fc;--line:#d9e2ee;--muted:#526783;--green:#1f8a49;--red:#cc3d2f;--shadow:0 20px 70px rgba(9,40,77,.14)}*{box-sizing:border-box}body{margin:0;background:#e8eef5;color:var(--ink);font-family:Arial,"Helvetica Neue",sans-serif}.shell{max-width:1440px;margin:auto;min-height:100vh;padding:24px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;color:#fff;background:var(--navy);padding:14px 18px;border-radius:18px 18px 0 0}.brand{display:flex;align-items:center;gap:12px;font-weight:700}.brand-mark{width:30px;height:30px;border-radius:50%;border:4px solid var(--orange);position:relative}.brand-mark:after{content:"";position:absolute;width:20px;height:4px;background:#fff;left:3px;top:9px}.actions{display:flex;gap:8px}.btn{border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;border-radius:999px;padding:9px 14px;font-weight:700;cursor:pointer}.btn.active,.btn:hover{background:#fff;color:var(--navy)}main{background:var(--paper);box-shadow:var(--shadow);min-height:calc(100vh - 118px);padding:clamp(22px,5vw,72px);display:grid;place-items:center}.page{width:min(1120px,100%);min-height:600px;background:#fff;border:1px solid var(--line);box-shadow:0 10px 28px rgba(25,54,94,.08);padding:clamp(28px,5vw,70px);position:relative;overflow:hidden}.page:before{content:"";position:absolute;top:0;left:0;width:100%;height:6px;background:var(--orange)}.kicker{font-size:12px;letter-spacing:.16em;font-weight:800;color:var(--orange);margin:8px 0 24px}.title{font-family:Georgia,serif;font-size:clamp(35px,5vw,67px);line-height:1.04;color:var(--navy);max-width:900px;margin:0;text-wrap:balance}.lede{max-width:760px;font-size:clamp(18px,2vw,23px);line-height:1.45;color:var(--muted);margin:22px 0 0}.cover{background:var(--navy);color:#fff;border:0;display:flex;flex-direction:column;justify-content:space-between}.cover:before{background:var(--orange)}.cover .title{color:#fff;max-width:720px}.cover .lede{color:#d7e7f7}.cover-grid{display:flex;gap:8px;margin-top:52px}.cover-grid span{width:34px;height:12px;background:var(--blue)}.cover-grid span:nth-child(1),.cover-grid span:nth-child(5){background:var(--orange)}.page-no{position:absolute;right:34px;bottom:26px;font-size:13px;color:#6d7f97}.cover .page-no{color:#b9c9dc}.flow{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:48px;position:relative}.flow:before{content:"";height:3px;background:var(--orange);position:absolute;left:9%;right:9%;top:36px}.flow-step{position:relative;background:#f5f8fc;border:1px solid var(--line);padding:58px 18px 18px;border-radius:12px;min-height:210px}.dot{position:absolute;top:16px;left:18px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--blue);color:#fff;font-weight:800}.flow-step:nth-child(4) .dot{background:var(--orange)}h2{font-size:22px;margin:0 0 10px;color:var(--navy)}p{font-size:16px;line-height:1.5;color:var(--muted);margin:0}.split{display:grid;grid-template-columns:1.05fr .95fr;gap:36px;margin-top:42px}.scale{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 6px 18px rgba(20,49,86,.08)}.scale-head{background:var(--navy);color:#fff;font-weight:800;padding:16px 24px}.score{display:flex;align-items:center;gap:16px;padding:10px 28px;font-weight:700}.score i{font-style:normal;color:#fff;border-radius:6px;width:42px;height:36px;display:grid;place-items:center;background:var(--red)}.score:nth-child(3) i{background:#ee8312}.score:nth-child(4) i{background:#bf8b02}.score:nth-child(5) i{background:#0872b7}.score:nth-child(6) i{background:#1f8a49}.notes{display:grid;gap:14px}.note{background:#f1f6fc;border:1px solid #d6e2f1;border-radius:12px;padding:22px}.note b{display:block;color:var(--navy);font-family:Georgia,serif;font-size:22px;margin-bottom:8px}.objective-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:40px}.objective{border:1px solid var(--line);border-radius:12px;padding:22px;background:#fff}.tag{display:inline-block;padding:5px 8px;color:#fff;background:var(--blue);border-radius:5px;font-size:12px;font-weight:800;margin-bottom:12px}.objective:nth-child(3) .tag{background:#80539c}.objective:nth-child(4) .tag{background:var(--green)}.criteria{display:grid;gap:12px;margin-top:38px}.criterion{display:grid;grid-template-columns:94px 1fr;gap:18px;align-items:start;border-bottom:1px solid var(--line);padding-bottom:12px}.criterion strong{color:var(--orange)}.example{margin-top:36px;background:#f5f8fc;border-radius:12px;padding:22px}.bars{display:grid;gap:14px;margin-top:18px}.bar-row{display:grid;grid-template-columns:160px 1fr 48px;gap:12px;align-items:center;font-size:14px}.track{height:10px;background:#e2e9f2;border-radius:8px;overflow:hidden}.fill{height:100%;background:var(--green)}.fill.low{background:var(--red)}.screen{margin-top:34px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}.screen-head{background:var(--navy);color:#fff;padding:14px 18px;font-weight:800}.screen-body{padding:20px}.screen-row{height:38px;border:1px solid var(--line);border-radius:8px;margin:10px 0;padding:10px;background:#fbfcfe}.chips{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:12px}.chip{padding:10px 0;text-align:center;border:1px solid var(--line);border-radius:8px;font-weight:800;color:#60728a}.chip:last-child{background:#e8eef6}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:40px}.summary>div{background:#f5f8fc;border:1px solid var(--line);padding:22px;border-radius:12px}.summary b{display:block;color:var(--navy);font-size:28px;margin-bottom:6px}.nav{display:flex;justify-content:space-between;align-items:center;background:#fff;border:1px solid var(--line);border-top:0;border-radius:0 0 18px 18px;padding:14px 18px}.nav button{border:0;background:var(--navy);color:#fff;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer}.nav button:disabled{opacity:.35;cursor:not-allowed}.progress{font-size:14px;color:var(--muted);font-weight:700}@media(max-width:760px){.shell{padding:0}.toolbar{border-radius:0}.page{min-height:calc(100vh - 130px);padding:30px 22px}.split{grid-template-columns:1fr}.flow{grid-template-columns:1fr 1fr}.flow:before{display:none}.objective-grid,.summary{grid-template-columns:1fr}.criterion{grid-template-columns:1fr}.bar-row{grid-template-columns:110px 1fr 40px}.cover-grid{margin-top:24px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<div class="shell"><header class="toolbar"><div class="brand"><span class="brand-mark" aria-hidden="true"></span><span>OPM PERFORMANCE APPRAISAL SYSTEM</span></div><div class="actions"><button class="btn active" id="en">English</button><button class="btn" id="es">Español</button></div></header><main><article class="page" id="page" aria-live="polite"></article></main><footer class="nav"><button id="prev">← <span data-t="previous">Previous</span></button><span class="progress" id="progress"></span><button id="next"><span data-t="next">Next</span> →</button></footer></div>
<script>
const copy={en:{previous:'Previous',next:'Next',pages:[
['cover','OPM Performance Appraisal System','From the shift record on the dock to the quarterly appraisal, this book explains how the system turns observed work into traceable evidence.'],
['flow','One chain: from the shift to the rating','Every completed form becomes evidence. The workflow connects four practical moments.',['Shift form|The supervisor records what was observed at the end of the shift.','Objective averages|Tasks feed the four performance objectives.','Quarterly roll-up|Evidence is checked for coverage and validity.','Appraisal|Objectives and behaviours form the final result.']],
['scale','How the observation form is completed','The supervisor rates only applicable, observed work during the shift.'],
['objectives','The four objectives behind every task','Every OPM task contributes to a defined operational objective.'],
['criteria','The leadership model completes the appraisal','Corporate behaviours are assessed on the same 1-5 scale and represent 30% of the final result.'],
['targets','How much each role must record','The quarterly process requires enough forms, coverage, and different supervisors to produce valid evidence.'],
['validity','When a quarterly appraisal is valid','Validity protects fairness: enough forms, enough of the shift period, different supervisors, and required cargo coverage.'],
['exampleGood','Rosa Vega - quarterly appraisal','Complete evidence can result in a strong, traceable outcome.'],
['exampleLow','Jorge Mena - quarterly appraisal','Insufficient evidence or a safety event changes the outcome and can trigger a performance improvement plan.'],
['lessons','Three lessons from the model','The system protects consistency, evidence quality, and fair interpretation.'],
['prototype','The form, on the supervisor’s phone','The workflow is designed for fast, practical use at the end of each shift.'],
['enter','The prototype - entering the data','Select the OPM, cargo type, vessel and mooring participation before the applicable tasks are shown.'],
['rate','The prototype - rating the tasks','Open the rubric, compare what was observed, then choose a score from 1 to 5 or N/A.'],
['scoring','When the supervisor can assign a score','A score is entered only for an observed, applicable task; it must be supported by the task rubric.'],
['save','The prototype - averages and saving the form','The system previews objective averages and saves the form as evidence.'],
['control','The prototype - quarterly control','Quarterly control shows evidence status, coverage, safety events and objective averages.'],
['coverEnd','Traceable. Fair. Evidence-based.','Every shift recorded becomes evidence. No rating is given without a reason, and no result ignores what was achieved.']
]},es:{previous:'Anterior',next:'Siguiente',pages:[
['cover','Sistema de Evaluación del Desempeño OPM','Desde el registro de turno en el muelle hasta la evaluación trimestral, este libro explica cómo el sistema convierte el trabajo observado en evidencia trazable.'],
['flow','Una cadena: del turno a la calificación','Cada ficha completada se convierte en evidencia. El flujo conecta cuatro momentos prácticos.',['Ficha de turno|El supervisor registra lo observado al cierre del turno.','Promedios por objetivo|Las actividades alimentan los cuatro objetivos de desempeño.','Consolidado trimestral|La evidencia se revisa por cobertura y validez.','Evaluación|Los objetivos y conductas forman el resultado final.']],
['scale','Cómo se completa la ficha de observación','El supervisor califica únicamente el trabajo aplicable y observado durante el turno.'],
['objectives','Los cuatro objetivos detrás de cada actividad','Cada actividad OPM aporta a un objetivo operativo definido.'],
['criteria','El modelo de liderazgo completa la evaluación','Las conductas corporativas se evalúan con la misma escala de 1 a 5 y representan el 30% del resultado final.'],
['targets','Cuánto debe registrar cada rol','El proceso trimestral requiere suficientes fichas, cobertura y supervisores distintos para producir evidencia válida.'],
['validity','Cuándo una evaluación trimestral es válida','La validez protege la equidad: suficientes fichas, parte suficiente del periodo, supervisores distintos y cobertura de carga requerida.'],
['exampleGood','Rosa Vega - evaluación trimestral','La evidencia completa puede resultar en un resultado sólido y trazable.'],
['exampleLow','Jorge Mena - evaluación trimestral','La evidencia insuficiente o un evento de seguridad cambia el resultado y puede activar un plan de mejora.'],
['lessons','Tres lecciones del modelo','El sistema protege la consistencia, la calidad de la evidencia y una interpretación justa.'],
['prototype','La ficha, en el teléfono del supervisor','El flujo está diseñado para un uso rápido y práctico al final de cada turno.'],
['enter','El prototipo - ingreso de datos','Seleccione el OPM, tipo de carga, nave y participación en amarre antes de mostrar las actividades aplicables.'],
['rate','El prototipo - calificación de actividades','Abra la rúbrica, compare lo observado y luego seleccione una calificación del 1 al 5 o N/A.'],
['scoring','Cuándo el supervisor puede asignar un puntaje','El puntaje se ingresa solo para una actividad observada y aplicable; debe estar sustentado por la rúbrica de la actividad.'],
['save','El prototipo - promedios y guardado de la ficha','El sistema muestra los promedios por objetivo y guarda la ficha como evidencia.'],
['control','El prototipo - control trimestral','El control trimestral muestra estado de evidencia, cobertura, eventos de seguridad y promedios por objetivo.'],
['coverEnd','Trazable. Justo. Basado en evidencia.','Cada turno registrado se convierte en evidencia. No se asigna una calificación sin motivo, y ningún resultado ignora lo alcanzado.']
]}};
let lang='en',i=0;const $=s=>document.querySelector(s);function visual(type,data){if(type==='cover'||type==='coverEnd')return `<div class="cover-grid"><span></span><span></span><span></span><span></span><span></span><span></span></div>`;if(type==='flow')return `<div class="flow">${data.map((x,n)=>{let[a,b]=x.split('|');return `<div class="flow-step"><span class="dot">${n+1}</span><h2>${a}</h2><p>${b}</p></div>`}).join('')}</div>`;if(type==='scale'||type==='rate')return `<div class="split"><div class="scale"><div class="scale-head">RATING SCALE / ESCALA</div>${[['1','Unsatisfactory / Insatisfactorio'],['2','Poor / Regular'],['3','Acceptable / Aceptable'],['4','Good / Bueno'],['5','Excellent / Excelente']].map(x=>`<div class="score"><i>${x[0]}</i>${x[1]}</div>`).join('')}</div><div class="notes"><div class="note"><b>Only what applies</b><p>Show and rate only the tasks related to the cargo type worked.</p></div><div class="note"><b>Evidence first</b><p>Use the rubric description to justify the selected rating.</p></div><div class="note"><b>N/A</b><p>Use N/A when the task was not performed; it is excluded from the average.</p></div></div></div>`;if(type==='objectives')return `<div class="objective-grid">${['O1 · 40%|Safety and compliance','O2 · 30%|Technical execution by cargo','O3 · 15%|Operational productivity','O4 · 15%|Care of cargo and equipment'].map(x=>{let[a,b]=x.split('|');return `<div class="objective"><span class="tag">${a}</span><h2>${b}</h2><p>Tasks are observed and consolidated against this objective.</p></div>`}).join('')}</div>`;if(type==='criteria')return `<div class="criteria">${['Communication','Adaptability','Teamwork','Initiative and innovation','Respect','Safety orientation','Results orientation'].map(x=>`<div class="criterion"><strong>${x}</strong><p>Observed behaviour is rated with the institutional leadership rubric.</p></div>`).join('')}</div>`;if(type==='exampleGood'||type==='exampleLow')return `<div class="example"><h2>${type==='exampleGood'?'VALID EVIDENCE · ABOVE EXPECTATIONS':'INSUFFICIENT EVIDENCE · BELOW EXPECTATIONS'}</h2><div class="bars">${['Safety and compliance','Technical execution','Productivity','Care of cargo'].map((x,n)=>`<div class="bar-row"><span>${x}</span><div class="track"><div class="fill ${type==='exampleLow'?'low':''}" style="width:${type==='exampleLow'?42:86-n*5}%"></div></div><b>${type==='exampleLow'?'2.5':'4.6'}</b></div>`).join('')}</div></div>`;if(type==='prototype'||type==='enter'||type==='rate'||type==='save'||type==='control'||type==='scoring')return `<div class="screen"><div class="screen-head">OPM PERFORMANCE SYSTEM</div><div class="screen-body"><div class="screen-row">OPM · Cargo type · Shift details</div><div class="screen-row">Task / Objective · Observation rubric</div><div class="screen-row">Comment (optional)</div><div class="chips"><span class="chip">1</span><span class="chip">2</span><span class="chip">3</span><span class="chip">4</span><span class="chip">5</span><span class="chip">N/A</span></div></div></div>`;if(type==='targets'||type==='validity'||type==='lessons')return `<div class="summary"><div><b>8</b><p>Minimum operational forms</p></div><div><b>3</b><p>Different supervisors</p></div><div><b>2</b><p>Forms per cargo type</p></div></div>`;return ''}function render(){let p=copy[lang].pages[i],[type,title,lede,data]=p;$('#page').className='page '+(type==='cover'||type==='coverEnd'?'cover':'');$('#page').innerHTML=`<div class="kicker">${type==='cover'||type==='coverEnd'?'COSCO SHIPPING PORTS CHANCAY':'OPM PERFORMANCE APPRAISAL SYSTEM'}</div><h1 class="title">${title}</h1><p class="lede">${lede}</p>${visual(type,data)}<span class="page-no">${i+1}</span>`;$('#progress').textContent=`${i+1} / ${copy[lang].pages.length}`;$('#prev').innerHTML=`← ${copy[lang].previous}`;$('#next').innerHTML=`${copy[lang].next} →`;$('#prev').disabled=i===0;$('#next').disabled=i===copy[lang].pages.length-1;document.documentElement.lang=lang}function setLang(l){lang=l;document.querySelectorAll('.btn').forEach(b=>b.classList.toggle('active',b.id===l));render()}$('#en').onclick=()=>setLang('en');$('#es').onclick=()=>setLang('es');$('#prev').onclick=()=>{i--;render()};$('#next').onclick=()=>{i++;render()};document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'&&i<copy[lang].pages.length-1){i++;render()}if(e.key==='ArrowLeft'&&i>0){i--;render()}});render();
</script>
<style>.actual-screen{display:block;width:min(720px,100%);max-height:430px;object-fit:contain;object-position:center top;margin:34px auto 0;border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 30px rgba(20,49,86,.12)}</style>
<script>
const originalVisual = visual;
visual = function(type, data) {
  if (type === 'criteria') {
    const source = lang === 'en' ? 'opm-rating-en.png' : 'opm-rating-es.png';
    const alt = lang === 'en' ? 'Performance observation rating screen' : 'Pantalla de calificación de evaluación de desenvolvimiento';
    return `<img class="actual-screen" src="${source}" alt="${alt}">`;
  }
  return originalVisual(type, data);
};
render();
</script>
</body></html>
